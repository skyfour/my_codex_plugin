<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBX</title>
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#222}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column}header{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #8883;background:var(--bar,#f5f6f8)}strong{font-size:13px}#version{color:#888;font-size:12px}#activity{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}button{width:29px;height:27px;border:1px solid #8883;border-radius:5px;background:transparent;color:inherit;display:inline-grid;place-items:center;cursor:pointer}button:hover{background:#8882}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #528bff}button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}main{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0;display:block}[hidden]{display:none!important}#state{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;padding:30px;text-align:center;background:inherit}#state h1{font-size:20px;margin:0}#detail{max-width:560px;color:#888;line-height:1.65;white-space:pre-line}#retry{width:auto;padding:0 16px;height:32px}dialog{max-width:500px;border:1px solid #8885;border-radius:10px;padding:22px;background:Canvas;color:CanvasText;box-shadow:0 12px 60px #0005}dialog::backdrop{background:#0006}dialog p{line-height:1.7}dialog footer{display:flex;justify-content:flex-end;gap:10px}dialog button{width:auto;padding:0 12px;height:32px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #777;padding:12px;border-radius:8px;max-width:90%;overflow-wrap:anywhere;z-index:10}body[data-theme=dark]{background:#181b20;color:#d7dce3;--bar:#1f232a}
</style></head><body>
<header><strong>DBX</strong><span id="version">官方 Docker Web</span><span id="activity" role="status"></span>
<button id="refresh" title="重新载入工作台" aria-label="重新载入工作台"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-5L4 9m1 4a7 7 0 0 0 12 5l3-3"/></svg></button>
<button id="check" title="检查官方稳定版" aria-label="检查官方稳定版"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M8 10h4m-2-2v4"/></svg></button>
<button id="update" title="一键更新官方版本" aria-label="一键更新官方版本"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button></header>
<main><iframe id="workbench" title="DBX 官方完整工作台" allow="clipboard-write" hidden></iframe><section id="state"><h1 id="heading">正在连接 DBX</h1><div id="detail">首次打开需要下载官方镜像。Docker 后台需要保持运行。</div><button id="retry" hidden>重试启动</button></section></main>
<dialog id="confirm-update" aria-labelledby="update-title"><h2 id="update-title">更新官方 DBX</h2><p>将检查并更新到官方稳定版。更新前会备份本插件的数据，过程中会中断 DBX 的查询和操作。请先保存工作台中的内容。</p><footer><button id="cancel">取消</button><button id="apply">备份并更新</button></footer></dialog><div id="toast" role="status" hidden></div>
<script>/* APP_SCRIPT */</script></body></html>
