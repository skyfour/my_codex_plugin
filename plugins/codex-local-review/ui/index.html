<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地代码审查</title><style>
:root{color-scheme:light dark;font:14px/1.5 system-ui;background:light-dark(#f6f7fb,#16191f);color:light-dark(#252c3b,#e1e5ef)}*{box-sizing:border-box}body{margin:0;padding:20px}h1{font-size:22px;margin:0}h2{font-size:15px}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}small,.muted{color:light-dark(#626c7f,#aab4c7)}section{background:light-dark(white,#20252e);border:1px solid light-dark(#dce1eb,#3b4452);border-radius:10px;padding:16px;margin-top:16px}label{display:block;font-weight:500}input,select,textarea,button{font:inherit;border:1px solid light-dark(#cbd2df,#505b6c);border-radius:6px;padding:8px;background:light-dark(white,#252c37);color:inherit}input,textarea{width:100%}textarea{resize:vertical}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.primary{background:#405ed7;color:white;border-color:#405ed7}input:focus,textarea:focus,button:focus,select:focus{outline:2px solid #7890ff;outline-offset:2px}.formgrid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:14px 0}.wide{grid-column:1/-1}#status{min-height:24px;white-space:pre-wrap;color:light-dark(#a13323,#ffb4a5)}#workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}#files{max-height:650px;overflow:auto}#files button{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}#files button[aria-current=true]{border-color:#5273ed;background:light-dark(#eaf0ff,#29385c)}#code{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane{min-width:0;border:1px solid light-dark(#dce1eb,#3b4452);border-radius:6px;overflow:auto;max-height:550px}.pane h3{position:sticky;top:0;margin:0;padding:8px;background:light-dark(#edf0f7,#303745);font-size:12px}.line{display:flex;white-space:pre;font:12px/1.65 ui-monospace,monospace;min-height:22px}.changed{background:light-dark(#fff1c7,#483f21)}.line button{position:sticky;left:0;flex:0 0 48px;border:0;border-radius:0;padding:0 6px;background:light-dark(#edf0f7,#303745);color:light-dark(#596985,#b9c8e0);font:inherit;text-align:right}.line code{padding:0 8px}.comment{border-left:3px solid #7188db;padding:8px 12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.comment button{float:right}#exportText{min-height:240px}#history{max-width:400px}[hidden]{display:none!important}@media(max-width:760px){#workspace,.formgrid,#code{grid-template-columns:1fr}#files{max-height:180px}body{padding:12px}}
</style><body><header><div><h1>本地代码审查</h1><small>本地快照 · 人工评论 · 审查记录</small></div><div class="row"><select id="history" aria-label="审查历史"><option value="">打开审查记录</option></select><button id="refresh">刷新记录</button></div></header>
<section><form id="create"><div class="formgrid"><label>项目绝对路径<input id="project" required placeholder="/Users/你的用户名/project" autocomplete="off"></label><label>审查范围<select id="mode"><option value="working">全部未提交改动（含新文件）</option><option value="staged">已暂存改动</option><option value="unstaged">未暂存改动</option><option value="commits">两个本地提交或分支</option><option value="files">指定文件（支持非 Git 目录）</option></select></label><label id="baseLabel" hidden>基线<input id="base" value="HEAD~1"></label><label id="targetLabel" hidden>目标<input id="target" value="HEAD"></label><label id="pathsLabel" class="wide" hidden>相对文件路径，每行一个<textarea id="paths" rows="3" placeholder="src/app.ts"></textarea></label></div><button id="createButton" class="primary">创建审查快照</button> <small>项目只读；后续修改不会改变已保存的快照。单文件上限 1 MiB，每次最多 300 个文件、10 MiB。</small></form></section><p id="status" role="status" aria-live="polite"></p>
<div id="workspace" hidden><section><h2 id="progress">文件</h2><nav id="files" aria-label="审查文件"></nav></section><section><header><h2 id="fileTitle"></h2><div class="row"><label><input type="checkbox" id="reviewed" style="width:auto"> 已审阅</label><button id="export">导出记录</button></div></header><p class="muted">左右展示旧、新代码；黄色行表示同一行号的内容有变化。点击行号添加评论。</p><div id="code"></div><form id="commentForm" hidden><h2 id="anchor"></h2><label>类型<select id="severity"><option value="note">备注</option><option value="issue">问题</option><option value="blocking">阻塞问题</option></select></label><label>评论<textarea id="commentText" required maxlength="10000" rows="3"></textarea></label><div class="row"><button class="primary">保存评论</button><button type="button" id="cancelComment">取消</button></div></form><div id="comments"></div></section></div>
<section id="exportPanel" hidden><header><h2>导出审查记录</h2><button id="closeExport">关闭</button></header><p class="muted">JSON 包含代码快照，Markdown 包含状态与评论。可下载，或从下方复制。</p><div class="row"><button id="downloadMd">下载 Markdown</button><button id="downloadJson">下载 JSON</button><select id="exportFormat"><option value="markdown">Markdown</option><option value="json">JSON</option></select></div><textarea id="exportText" readonly aria-label="导出内容"></textarea></section><!-- SCRIPT --></body></html>
