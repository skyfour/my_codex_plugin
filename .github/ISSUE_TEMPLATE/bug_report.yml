name: 报告插件问题
description: 安装、启动或使用插件时遇到错误
title: "[Bug] "
assignees:
  - skyfour
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 issue。此处内容公开可见，请移除令牌、Cookie、认证头、业务数据、数据库连接和本机绝对路径。
  - type: dropdown
    id: plugin
    attributes:
      label: 所属插件
      options:
        - codex-task-panel（任务看板）
        - codex-api-client（API 调试台）
        - codex-local-review（本地代码审查）
        - dbx（数据库工作台）
        - 安装器／其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 填实际安装版本；DBX 请区分适配器和官方本体。不知道可填“未知”。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Codex 桌面版／CLI 与 Node.js 版本；DBX 问题可补充 Docker 版本。不要粘贴完整配置。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从哪里开始、做了什么、在哪一步出错？请使用虚构示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以补充经过裁剪和脱敏的错误信息或截图。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已移除凭据、业务数据、数据库连接和本机绝对路径。
          required: true
