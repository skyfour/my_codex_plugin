name: 提出功能建议
description: 描述你想解决的使用问题
title: "[Feature] "
assignees:
  - skyfour
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议。此处内容公开可见，请使用虚构示例，不要上传凭据或业务数据。
  - type: dropdown
    id: plugin
    attributes:
      label: 所属插件
      options:
        - codex-task-panel（任务看板）
        - codex-api-client（API 调试台）
        - codex-local-review（本地代码审查）
        - dbx（数据库工作台）
        - 安装器／其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 在什么场景下遇到困难？目前如何绕过？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
      description: 有这个功能后，你希望怎样操作、看到什么结果？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方式
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已移除凭据和业务数据。
          required: true
